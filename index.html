<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tomar Pedido — Evena Foods</title>
<style>
  :root {
    --ev-orange: #FF931E;
    --ev-orange-text: #B36A1A;
    --ev-orange-tint: #FFF4E8;
    --ev-grey: #5F5F5E;
    --ev-grey-dark: #454544;
    --ev-grey-muted: #9A9A99;
    --ev-grey-light: #ECECEC;
    --ev-grey-border: #DCDCDB;
    --ev-white: #FFFFFF;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--ev-white);
    min-height: 100vh;
    color: var(--ev-grey);
  }
  #root { padding: 24px; max-width: 820px; margin: 0 auto; }

  .header-bar {
    background: var(--ev-white);
    border: 1px solid var(--ev-grey-border);
    border-radius: 16px; padding: 22px 28px; margin-bottom: 24px;
    color: var(--ev-grey); display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .header-bar .brand { display: flex; align-items: center; gap: 14px; }
  .header-bar .brand img { height: 44px; width: auto; display: block; }
  .header-bar h1 { font-size: 22px; font-weight: 800; }
  .header-bar p { font-size: 13px; opacity: .7; margin-top: 3px; }
  .header-badge { background: var(--ev-orange-tint); border: 2px solid var(--ev-orange); border-radius: 12px; padding: 10px 18px; text-align: center; }
  .header-badge .num { font-size: 26px; font-weight: 800; line-height: 1; color: var(--ev-orange-text); }
  .header-badge .lbl { font-size: 11px; margin-top: 2px; color: var(--ev-grey-muted); }
  .header-btn {
    background: var(--ev-grey-light); border: none; color: var(--ev-grey);
    border-radius: 10px; padding: 8px 18px; font-weight: 700; font-size: 13px; cursor: pointer;
  }

  .card { background: var(--ev-white); border: 1px solid var(--ev-grey-border); border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,.05); margin-bottom: 20px; }
  .label { display: block; font-size: 12px; font-weight: 600; color: var(--ev-grey-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .input {
    width: 100%; padding: 11px 14px; border: 2px solid var(--ev-grey-border); border-radius: 10px; font-size: 14px;
    outline: none; transition: border-color .15s; color: var(--ev-grey);
  }
  .input:focus { border-color: var(--ev-orange); }
  .field-group { position: relative; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; }
  .row .grow { flex: 1; }

  .dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--ev-white); border: 2px solid var(--ev-grey-border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 100; max-height: 280px; overflow-y: auto;
  }
  .dropdown-item {
    padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--ev-grey-light);
  }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover, .dropdown-item.active { background: var(--ev-orange-tint); }
  .dropdown-item .nombre { font-size: 13px; font-weight: 500; color: var(--ev-grey); }
  .dropdown-item .cat { font-size: 11px; color: var(--ev-grey-muted); }
  .dropdown-item .tipo-chip { font-size: 10px; color: var(--ev-grey); font-weight: 600; background: var(--ev-grey-light); padding: 2px 8px; border-radius: 6px; }

  .btn { border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; padding: 11px 22px; }
  .btn[disabled] { background: var(--ev-grey-light) !important; color: var(--ev-grey-muted) !important; cursor: not-allowed; }
  .btn-primary { background: var(--ev-grey); color: #fff; }
  .btn-dark { background: var(--ev-orange-text); color: #fff; padding: 6px 18px; font-size: 13px; border-radius: 8px; }
  .btn-outline-danger { background: none; border: 1px solid #fca5a5; color: #ef4444; padding: 6px 14px; font-size: 12px; border-radius: 8px; }

  .empty-state {
    background: var(--ev-white); border-radius: 14px; padding: 40px 24px; text-align: center;
    color: var(--ev-grey-muted); border: 2px dashed var(--ev-grey-border);
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
  .empty-state .title { font-size: 15px; font-weight: 600; }
  .empty-state .sub { font-size: 13px; margin-top: 4px; }

  .table-card { background: var(--ev-white); border: 1px solid var(--ev-grey-border); border-radius: 14px; box-shadow: 0 1px 6px rgba(0,0,0,.05); overflow: hidden; }
  .table-head {
    display: grid; padding: 10px 16px; background: var(--ev-grey-light); border-bottom: 1px solid var(--ev-grey-border);
    font-size: 11px; font-weight: 700; color: var(--ev-grey); text-transform: uppercase; letter-spacing: .05em;
  }
  .pedido-row {
    display: grid; grid-template-columns: 1fr 90px 120px 36px; padding: 11px 16px; align-items: center;
    border-bottom: 1px solid var(--ev-grey-light);
  }
  .pedido-row:last-child { border-bottom: none; }
  .pedido-row .nombre { font-size: 13px; font-weight: 500; color: var(--ev-grey); }
  .pedido-row .cat { font-size: 11px; color: var(--ev-grey-muted); margin-top: 1px; }
  .pedido-row .cant { text-align: center; font-weight: 700; font-size: 16px; color: var(--ev-orange-text); }
  .tipo-chip-cell { text-align: center; }
  .tipo-chip { font-size: 11px; color: var(--ev-grey); font-weight: 600; background: var(--ev-grey-light); padding: 2px 8px; border-radius: 6px; }
  .remove-btn { background: none; border: none; cursor: pointer; color: #fca5a5; font-size: 16px; border-radius: 6px; padding: 2px 6px; }
  .remove-btn:hover { color: #ef4444; }

  .footer-row {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
    background: var(--ev-grey-light); border-top: 2px solid var(--ev-grey-border); gap: 10px; flex-wrap: wrap;
  }
  .footer-row .info { font-size: 13px; font-weight: 600; color: var(--ev-grey); }
  .footer-actions { display: flex; gap: 8px; }

  .pendientes-card { background: var(--ev-orange-tint); border: 2px solid var(--ev-orange); border-radius: 14px; padding: 16px 20px; margin-top: 16px; }
  .pendientes-title { font-size: 13px; font-weight: 800; color: var(--ev-orange-text); display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .pendiente-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,147,30,.3); gap: 10px; flex-wrap: wrap; }
  .pendiente-row:last-child { border-bottom: none; }
  .pendiente-row .nombre { font-size: 13px; font-weight: 700; color: var(--ev-grey); }
  .pendiente-row .sugerencia { font-size: 12px; color: var(--ev-grey-muted); }

  .resumen-head, .resumen-row, .resumen-total {
    grid-template-columns: 2fr 90px 110px 65px 110px 110px 120px; gap: 8px; align-items: center;
  }
  .resumen-head { display: grid; background: var(--ev-grey); color: #fff; padding: 12px 16px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .resumen-row { display: grid; padding: 14px 16px; border-bottom: 1px solid var(--ev-grey-light); }
  .resumen-row:last-child { border-bottom: none; }
  .resumen-total { display: grid; padding: 13px 16px; background: var(--ev-grey); color: #fff; }
  .center { text-align: center; }
  .tipo-name { font-weight: 700; font-size: 14px; color: var(--ev-grey); }
  .orden-pill { display: inline-block; background: var(--ev-orange-text); color: #fff; border-radius: 50%; width: 28px; height: 28px; line-height: 28px; font-size: 13px; font-weight: 800; }
  .pill { display: inline-block; border-radius: 8px; padding: 3px 14px; font-weight: 800; font-size: 16px; }
  .pill-green { background: #dcfce7; color: #15803d; }
  .pill-amber { background: #fef3c7; color: #b45309; }
  .pill-grey { background: var(--ev-grey-light); color: var(--ev-grey-muted); }

  .section-title { font-size: 14px; font-weight: 700; color: var(--ev-grey-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .05em; }

  .tarima-card { display: flex; align-items: stretch; background: var(--ev-white); border: 1px solid var(--ev-grey-border); border-radius: 14px; margin-bottom: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.06); overflow: hidden; }
  .tarima-body { flex: 1; min-width: 0; }
  .tarima-header { background: var(--ev-grey); color: #fff; padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; }
  .tarima-header .num { font-weight: 800; font-size: 15px; }
  .tarima-header .meta { font-size: 12px; opacity: .8; }

  .tarima-alert { width: 78px; min-width: 78px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; color: #fff; text-align: center; }
  .tarima-alert-danger { background: #DC2626; }
  .tarima-alert-warn { background: var(--ev-orange); }
  .tarima-alert-icon { font-size: 22px; line-height: 1; }
  .tarima-alert-item { display: flex; flex-direction: column; gap: 1px; }
  .tarima-alert-item .lbl { font-size: 10px; font-weight: 800; letter-spacing: .05em; }
  .tarima-alert-item .sub { font-size: 9px; font-weight: 600; opacity: .9; white-space: nowrap; }

  .cama-row { display: flex; align-items: stretch; border-bottom: 1px solid var(--ev-grey-light); cursor: grab; transition: opacity .15s, box-shadow .1s; user-select: none; }
  .cama-row:last-child { border-bottom: none; }
  .cama-row.dragging { opacity: .35; }
  .cama-row.drop-target { box-shadow: inset 0 3px 0 var(--ev-orange); background: var(--ev-orange-tint); }
  .drag-handle { width: 22px; min-width: 22px; display: flex; align-items: center; justify-content: center; color: var(--ev-grey-muted); font-size: 16px; cursor: grab; }
  .drop-nueva-tarima {
    border: 2px dashed var(--ev-grey-border); border-radius: 14px; padding: 22px;
    text-align: center; color: var(--ev-grey-muted); font-size: 13px; font-weight: 700;
    margin-top: 16px; transition: border-color .15s, background .15s, color .15s;
    letter-spacing: .03em;
  }
  .drop-nueva-tarima.drop-target {
    border-color: var(--ev-orange); background: var(--ev-orange-tint); color: var(--ev-orange-text);
  }
  .cama-label {
    width: 68px; min-width: 68px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; border-right: 2px solid var(--ev-grey-light); padding: 8px 4px; gap: 2px;
  }
  .cama-label .txt { font-size: 10px; font-weight: 800; letter-spacing: .04em; }
  .cama-content { flex: 1; padding: 10px 16px; }
  .cama-pura { display: flex; justify-content: space-between; align-items: center; }
  .cama-pura .nombre { font-weight: 600; font-size: 14px; }
  .cama-pura .cajas { border-radius: 8px; padding: 3px 12px; font-weight: 700; font-size: 14px; border: 1px solid; }

  .mixta-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .mixta-head .lbl { font-weight: 700; font-size: 13px; color: var(--ev-orange-text); }
  .mixta-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .mixta-bar-track { width: 100px; height: 8px; background: var(--ev-grey-light); border-radius: 4px; overflow: hidden; }
  .mixta-bar-fill { height: 100%; border-radius: 4px; }
  .mixta-bar-text { font-size: 11px; font-weight: 700; color: var(--ev-grey); white-space: nowrap; }
  .mixta-items { display: flex; flex-wrap: wrap; gap: 6px; }
  .mixta-chip { border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 12px; font-weight: 600; border: 1px solid; display: inline-flex; align-items: center; gap: 4px; cursor: grab; user-select: none; }
  .mixta-chip.chip-dragging { opacity: .35; }
  .cama-row.chip-drop-ok { outline: 2px dashed var(--ev-orange); outline-offset: -3px; }
  .mixta-chip .esp { opacity: .6; }
  .chip-btn { background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 800; line-height: 1; padding: 0 2px; border-radius: 4px; opacity: .55; }
  .chip-btn:hover { opacity: 1; background: rgba(0,0,0,.08); }

  .detalle-row {
    display: grid; grid-template-columns: 1fr 80px 110px; padding: 11px 16px; align-items: center;
    border-bottom: 1px solid var(--ev-grey-light);
  }
  .detalle-row:last-child { border-bottom: none; }
  .detalle-row .nombre { font-size: 13px; font-weight: 500; }
  .detalle-row .cat { font-size: 11px; color: var(--ev-grey-muted); margin-top: 1px; }
  .detalle-row .cant { text-align: center; font-weight: 700; color: var(--ev-orange-text); }
  .detalle-row .tipo { text-align: right; font-size: 11px; color: var(--ev-grey-muted); font-weight: 600; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  .modal-box {
    background: var(--ev-white); border-radius: 16px; padding: 26px 28px; width: 100%; max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .modal-box h3 { font-size: 16px; font-weight: 800; color: var(--ev-grey-dark); margin-bottom: 4px; }
  .modal-box .modal-sub { font-size: 12px; color: var(--ev-grey-muted); margin-bottom: 18px; }
  .modal-box .field-group { margin-bottom: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .btn-ghost { background: none; border: none; color: var(--ev-grey-muted); font-weight: 700; font-size: 13px; padding: 11px 16px; cursor: pointer; border-radius: 10px; }
  .btn-ghost:hover { background: var(--ev-grey-light); }
</style>
</head>

    var SPECS = {
      "Galón 3.8L":       { cajasCama: 14, cajasTarima: 56,  camasTarima: 4, orden: 1, kgCaja: 16,   cmCama: 33.6 },

    };

    var VALORES_ESPACIO = {
      "Garrafa 5L":       1.56,
      "Limón Desh":       1.56,
      "500 ml":           0.51,
      "Galón 3.8L":       1.0,
      "Salsa / Pulpa 1L": 1.0,
      "Jarabe 1L":        1.0
    };
    var LIMITE_MIXTA = 14.45;
    var MAX_CAMAS    = 5;

    var COLORES_TIPO = {
      "Galón 3.8L":       { bg: "#dbeafe", text: "#1d4ed8", borde: "#93c5fd" },
      "Garrafa 5L":       { bg: "#ffedd5", text: "#c2410c", borde: "#fb923c" },

    };

    function getTipo(nombre) {
      if (/5\s*LT|5L\s*C\/4/i.test(nombre))        return "Garrafa 5L";
      if (nombre.indexOf("3.8L") !== -1)            return "Galón 3.8L";
      if (nombre.indexOf("500ML") !== -1)           return "500 ml";
      if (nombre.indexOf("750 GR") !== -1)          return "Limón Desh";
      if (
        nombre.indexOf("ENDULZANTE") !== -1 ||
        nombre.indexOf("CURAZAO") !== -1    ||
        nombre.indexOf("GRANADINA") !== -1  ||
        nombre.indexOf("BLACKMIX") !== -1
      )                                              return "Jarabe 1L";
      return "Salsa / Pulpa 1L";
    }

    function calcularKgTarima(tarima) {
      return tarima.camas.reduce(function (total, cama) {
        if (cama.tipo === "pura") return total + cama.cajas * SPECS[cama.tipoCaja].kgCaja;
        return total + cama.items.reduce(function (s, it) { return s + it.cajas * SPECS[it.tipoCaja].kgCaja; }, 0);
      }, 0);
    }

    function calcularCmTarima(tarima) {
      return tarima.camas.reduce(function (total, cama) {
        if (cama.tipo === "pura") return total + SPECS[cama.tipoCaja].cmCama;
        // cama mixta: la altura la dicta la caja más alta que lleve
        var maxCm = cama.items.reduce(function (m, it) { return Math.max(m, SPECS[it.tipoCaja].cmCama); }, 0);
        return total + maxCm;
      }, 0);
    }

    /* ───── ALGORITMO DE ARMADO ───── */
    function fillMixedCama(pool) {
      var items = [];
      var espacioUsado = 0;
      for (var i = 0; i < pool.length; i++) {
        var entry = pool[i];
        if (entry.cajas <= 0) continue;
        var val   = VALORES_ESPACIO[entry.tipo];
        var caben = Math.floor((LIMITE_MIXTA - espacioUsado) / val);
        var tomar = Math.min(entry.cajas, caben);
        if (tomar <= 0) continue;
        items.push({ tipoCaja: entry.tipo, cajas: tomar, espacio: +(tomar * val).toFixed(2) });
        espacioUsado = +(espacioUsado + tomar * val).toFixed(2);
        entry.cajas -= tomar;
      }
      return { items: items, espacioUsado: espacioUsado };
    }

    function calcularResumenTarimas(pedido) {
      var mapa = {};
      pedido.forEach(function (item) {
        var tipo = getTipo(item.nombre);
        mapa[tipo] = (mapa[tipo] || 0) + item.cantidad;
      });
      return Object.keys(mapa).map(function (tipo) {
        var cajasPedidas = mapa[tipo];
        var spec = SPECS[tipo];
        var tarimasPuras   = Math.floor(cajasPedidas / spec.cajasTarima);
        var cajasSobrantes = cajasPedidas - tarimasPuras * spec.cajasTarima;
        return Object.assign({ tipo: tipo, cajasPedidas: cajasPedidas, tarimasPuras: tarimasPuras, cajasSobrantes: cajasSobrantes }, spec);
      }).sort(function (a, b) { return a.orden - b.orden; });
    }

    function calcularTarimas(resumenTarimas) {
      var result = [];

      // Regla 500 ml:
      // - Pedido solo 500ml → hasta 7 camas (spec normal).
      // - Pedido mixto → las tarimas COMPLETAS de 7 camas se arman igual;
      //   los sobrantes (< 161 cajas) pasan a Fase 2 y acaban en una cama mixta.
      //   No se expanden con camas extra: eso se reserva para la cama mixta de Fase 2.
      var esSolo500ml = resumenTarimas.length === 1 && resumenTarimas[0].tipo === "500 ml";

      // Fase 1: tarimas puras (tipo único, camas según spec)
      resumenTarimas.forEach(function (row) {
        var spec         = SPECS[row.tipo];
        var kgPorCama    = spec.cajasCama * spec.kgCaja;
        var es500mlMixto = row.tipo === "500 ml" && !esSolo500ml;

        for (var i = 0; i < row.tarimasPuras; i++) {
          var camas = [];
          for (var c = 0; c < spec.camasTarima; c++) {
            camas.push({ tipo: "pura", tipoCaja: row.tipo, cajas: spec.cajasCama });
          }
          // Reglas de peso/altura solo para tipos que NO sean 500ml en pedido mixto
          if (!es500mlMixto) {
            var kg = camas.length * kgPorCama;
            var cm = camas.length * spec.cmCama;
            while (kg < 900 && camas.length < 7 && row.cajasSobrantes >= spec.cajasCama
                   && (kg + kgPorCama) <= 1250 && (cm + spec.cmCama) <= ALTURA_MAX) {
              camas.push({ tipo: "pura", tipoCaja: row.tipo, cajas: spec.cajasCama });
              row.cajasSobrantes -= spec.cajasCama;
              kg += kgPorCama;
              cm += spec.cmCama;
            }
          }
          result.push({ camas: camas });
        }
      });

      // Fase 2: sobrantes → camas puras + parciales, por tipo
      var remaining = {};
      resumenTarimas.forEach(function (row) {
        if (row.cajasSobrantes <= 0) return;
        var spec      = SPECS[row.tipo];
        var pureCamas = Math.floor(row.cajasSobrantes / spec.cajasCama);
        var partial   = row.cajasSobrantes % spec.cajasCama;
        remaining[row.tipo] = { pureCamas: pureCamas, partial: partial, spec: spec };
      });

      // Fase 2a: si algún tipo NO-500ml junta MAX_CAMAS camas puras, tarima completa sin mezcla.
      // 500ml en pedidos mixtos se maneja en Fase 2_500ml (nunca aquí).
      Object.keys(remaining).forEach(function (tipo) {
        if (tipo === "500 ml" && !esSolo500ml) return;
        var info = remaining[tipo];
        while (info.pureCamas >= MAX_CAMAS) {
          var camas = [];
          for (var i = 0; i < MAX_CAMAS; i++) camas.push({ tipo: "pura", tipoCaja: tipo, cajas: info.spec.cajasCama });
          result.push({ camas: camas });
          info.pureCamas -= MAX_CAMAS;
        }
      });

      // Pool de parciales (se calcula antes de Fase 2_500ml para que ésta pueda consumirlos)
      var partialPool = Object.keys(remaining)
        .filter(function (t) { return remaining[t].partial > 0; })
        .map(function (t) { return { tipo: t, cajas: remaining[t].partial, orden: remaining[t].spec.orden }; })
        .sort(function (a, b) { return b.cajas - a.cajas || a.orden - b.orden; });

      // Fase 2_500ml: sobrantes de 500ml en pedidos mixtos.
      // Se arman tarimas con hasta (camasTarima-1) = 6 camas puras + 1 cama mixta con los parciales disponibles.
      if (!esSolo500ml && remaining["500 ml"] && remaining["500 ml"].pureCamas > 0) {
        var info500     = remaining["500 ml"];
        var MAX500PURAS = SPECS["500 ml"].camasTarima - 1; // 6
        while (info500.pureCamas > 0) {
          var camas500 = [];
          var tomar500 = Math.min(info500.pureCamas, MAX500PURAS);
          for (var c5 = 0; c5 < tomar500; c5++) {
            camas500.push({ tipo: "pura", tipoCaja: "500 ml", cajas: SPECS["500 ml"].cajasCama });
          }
          info500.pureCamas -= tomar500;
          if (partialPool.some(function (e) { return e.cajas > 0; })) {
            var filled500 = fillMixedCama(partialPool);
            if (filled500.items.length > 0) {
              var sorted500 = filled500.items.slice().sort(function (a, b) { return SPECS[a.tipoCaja].orden - SPECS[b.tipoCaja].orden; });
              camas500.push({ tipo: "mixta", items: sorted500, espacioUsado: filled500.espacioUsado });
            }
          }
          result.push({ camas: camas500 });
        }
      }

      // Fase 2b: combinar las camas puras restantes de tipos NO-500ml en bloques.
      // Si el pool de parciales ya fue consumido por la tarima 500ml, los bloques usan MAX_CAMAS
      // (no necesitan reservar slot para mixta), lo que permite agrupar más camas en menos tarimas.
      var tiposConPure = Object.keys(remaining)
        .filter(function (t) { return remaining[t].pureCamas > 0 && !(t === "500 ml" && !esSolo500ml); })
        .sort(function (a, b) {
          return remaining[b].pureCamas - remaining[a].pureCamas || remaining[a].spec.orden - remaining[b].spec.orden;
        });

      var flatUnits = [];
      tiposConPure.forEach(function (tipo) {
        for (var i = 0; i < remaining[tipo].pureCamas; i++) flatUnits.push(tipo);
      });

      var tamBloque    = hayParciales ? (MAX_CAMAS - 1) : MAX_CAMAS;

      for (var i = 0; i < flatUnits.length; i += tamBloque) {

      }

      //   ANTES de que Fase 3 use ese mismo pool para su cama mixta genérica de cada bloque.
      //   Prioridad 1: 6 × 5L + 7 × 1L  (consume más 1L; regresa 3 garrafas al pool)
      //   Prioridad 2: 9 × 5L + 3 × 1L
      //   Sin suficientes 1L en el pool (<3): deja la cama pura
      var TIPOS_1L_PREF = ["Salsa / Pulpa 1L", "Jarabe 1L"];
      function convertirGarrafa5L() {
        var entry1L = null, max1L = 0;
        TIPOS_1L_PREF.forEach(function (t) {
          var e = partialPool.filter(function (x) { return x.tipo === t; })[0];
          if (e && e.cajas > max1L) { max1L = e.cajas; entry1L = e; }
        });
        if (!entry1L || max1L < 3) return null; // Sin suficientes 1L, dejar pura

        var cajas5L, cajas1L;
        if (max1L >= 7) {
          cajas5L = 6; cajas1L = 7;
          var entry5L = partialPool.filter(function (x) { return x.tipo === "Garrafa 5L"; })[0];
          if (entry5L) { entry5L.cajas += 3; } else { partialPool.push({ tipo: "Garrafa 5L", cajas: 3, orden: SPECS["Garrafa 5L"].orden }); }
        } else {
          cajas5L = 9; cajas1L = 3;
        }
        entry1L.cajas -= cajas1L;

        return {
          tipo: "mixta",
          items: [
            { tipoCaja: "Garrafa 5L", cajas: cajas5L, espacio: cajas5L },
            { tipoCaja: entry1L.tipo, cajas: cajas1L, espacio: cajas1L }
          ],
          espacioUsado: cajas5L + cajas1L
        };
      }

      // Fase 3: cada bloque → tarima con camas puras (ordenadas por estiba) + 1 cama mixta del pool
      bloques.forEach(function (bloque) {
        var ordenado = bloque.slice().sort(function (a, b) { return SPECS[a].orden - SPECS[b].orden; });
        var camas = ordenado.map(function (tipo) {
          if (tipo === "Garrafa 5L") {
            var convertida = convertirGarrafa5L();
            if (convertida) return convertida;
          }
          return { tipo: "pura", tipoCaja: tipo, cajas: SPECS[tipo].cajasCama };
        });

        if (partialPool.some(function (e) { return e.cajas > 0; })) {
          var filled = fillMixedCama(partialPool);
          if (filled.items.length > 0) {
            var sortedItems = filled.items.slice().sort(function (a, b) { return SPECS[a.tipoCaja].orden - SPECS[b.tipoCaja].orden; });
            camas.push({ tipo: "mixta", items: sortedItems, espacioUsado: filled.espacioUsado });
          }
        }
        result.push({ camas: camas });
      });

      // Fase 4: lo que sobre del pool de parciales
      var pendientes = [];
      if (partialPool.some(function (e) { return e.cajas > 0; })) {
        if (result.length === 0) {
          while (partialPool.some(function (e) { return e.cajas > 0; })) {
            var filled2 = fillMixedCama(partialPool);
            if (filled2.items.length === 0) break;
            var sortedItems2 = filled2.items.slice().sort(function (a, b) { return SPECS[a.tipoCaja].orden - SPECS[b.tipoCaja].orden; });
            result.push({ camas: [{ tipo: "mixta", items: sortedItems2, espacioUsado: filled2.espacioUsado }] });
          }
        } else {
          partialPool.forEach(function (e) {
            if (e.cajas > 0) pendientes.push({ tipo: e.tipo, cajas: e.cajas });
          });
        }
      }

      // (La regla de Garrafa 5L se movió a Fase 2c, antes de Fase 3 — ver arriba)

      // Consolidación de camas mixtas:
      // Si una tarima tiene 1–2 camas mixtas, moverlas a la tarima con menos camas totales
      // para dejar tarimas completas con puras únicamente.
      (function () {
        function limiteMax(tarima) {
          var tiene500 = tarima.camas.some(function (c) { return c.tipo === "pura" && c.tipoCaja === "500 ml"; });
          return tiene500 ? SPECS["500 ml"].camasTarima : MAX_CAMAS;
        }
        // Una sola pasada por índice fijo: cada tarima se evalúa como posible origen

        for (var si = 0; si < result.length; si++) {

          var mixtas = src.camas.filter(function (c) { return c.tipo === "mixta"; });
          if (mixtas.length < 1 || mixtas.length > 2) continue;

          var dstIdx = -1, minTotal = Infinity;
          for (var di = 0; di < result.length; di++) {

            var dst = result[di];
            var cap = limiteMax(dst);
            if (dst.camas.length + mixtas.length <= cap && dst.camas.length < minTotal) {

              dstIdx   = di;
            }
          }
          if (dstIdx === -1) continue;

          // Mover mixtas al destino
          mixtas.forEach(function (m) { result[dstIdx].camas.push(m); });
          src.camas = src.camas.filter(function (c) { return c.tipo !== "mixta"; });
        }
        // Limpiar tarimas que quedaron sin camas tras mover todas sus mixtas
        for (var i = result.length - 1; i >= 0; i--) {
          if (result[i].camas.length === 0) result.splice(i, 1);
        }
      })();

      return {
        tarimas: result.map(function (t, i) { return Object.assign({ numero: i + 1 }, t); }),
        pendientes: pendientes
      };
    }

    function moverTipoEntreCamas(srcTIdx, srcDi, dstTIdx, dstDi, tipo) {
      if (srcTIdx === dstTIdx && srcDi === dstDi) return;
      var srcT = state.tarimas[srcTIdx];
      var dstT = state.tarimas[dstTIdx];
      if (!srcT || !dstT) return;
      var srcSi = srcT.camas.length - 1 - srcDi;
      var dstSi = dstT.camas.length - 1 - dstDi;
      var srcCama = srcT.camas[srcSi];
      var dstCama = dstT.camas[dstSi];
      if (!srcCama || srcCama.tipo !== "mixta") return;
      if (!dstCama || dstCama.tipo !== "mixta") return;
      var srcItem = srcCama.items.find(function (it) { return it.tipoCaja === tipo; });
      if (!srcItem) return;
      // Quitar del origen
      srcCama.items = srcCama.items.filter(function (it) { return it.tipoCaja !== tipo; });
      srcCama.espacioUsado = srcCama.items.reduce(function (s, it) { return s + it.espacio; }, 0);
      // Agregar al destino (merge si ya existe el mismo tipo)
      var dstItem = dstCama.items.find(function (it) { return it.tipoCaja === tipo; });
      if (dstItem) {
        dstItem.cajas   += srcItem.cajas;
        dstItem.espacio += srcItem.espacio;
      } else {
        dstCama.items.push({ tipoCaja: tipo, cajas: srcItem.cajas, espacio: srcItem.espacio });
        dstCama.items.sort(function (a, b) { return SPECS[a.tipoCaja].orden - SPECS[b.tipoCaja].orden; });
      }
      dstCama.espacioUsado += srcItem.espacio;
      // Si la cama origen quedó sin items, eliminarla
      if (srcCama.items.length === 0) srcT.camas.splice(srcSi, 1);

    function quitarCajaMixta(tIdx, di, tipo) {

      var item     = cama.items.find(function (it) { return it.tipoCaja === tipo; });
      if (!item || item.cajas <= 0) return;
      item.cajas  -= 1;
      item.espacio = +((item.cajas * VALORES_ESPACIO[tipo]).toFixed(2));
      var itemVacio = item.cajas === 0; // última caja de este tipo
      cama.items   = cama.items.filter(function (it) { return it.cajas > 0; });
      cama.espacioUsado = +(cama.items.reduce(function (s, it) { return s + it.espacio; }, 0).toFixed(2));
      if (cama.items.length === 0) disp.splice(di, 1);
      tarima.camas = disp.slice().reverse();
      state.tarimas = state.tarimas.filter(function (t) { return t.camas.length > 0; });
      state.tarimas.forEach(function (t, i) { t.numero = i + 1; });
      // Acumular la caja en pendientes

      if (pend) { pend.cajas += 1; } else { state.pendientes.push({ tipo: tipo, cajas: 1 }); }
      // Si era la última caja de este tipo en la cama, crear tarima extra de mix

        if (pendTipo && pendTipo.cajas > 0) {

          state.tarimas.push({

      var tarima = state.tarimas[tIdx];
      var disp   = tarima.camas.slice().reverse();
      var cama   = disp[di];
      var item   = cama.items.find(function (it) { return it.tipoCaja === tipo; });
      var val    = VALORES_ESPACIO[tipo];
      if (item) {

      state.pendientes = state.pendientes.filter(function (p) { return p.cajas > 0; });

    function generarPDF() {
      var resumen    = calcularResumenTarimas(state.pedido);
      var tarimas    = state.tarimas || [];
      var pendientes = state.pendientes || [];
      var fecha      = new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric' });

        'h2{font-size:13px;margin:18px 0 7px;border-bottom:2px solid #5F5F5E;padding-bottom:4px;color:#5F5F5E;text-transform:uppercase;letter-spacing:.5px;}',
        'table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px;}',
        'th{background:#5F5F5E;color:#fff;padding:5px 8px;text-align:left;}',
        'td{padding:4px 8px;border-bottom:1px solid #DCDCDB;}',
        'tr:nth-child(even) td{background:#ECECEC;}',
        '.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;border-bottom:3px solid #5F5F5E;padding-bottom:10px;}',
        '.stats{text-align:right;font-size:11px;color:#5F5F5E;line-height:1.6;}',
        '.tarima{page-break-inside:avoid;border:1px solid #DCDCDB;border-radius:4px;margin-bottom:10px;overflow:hidden;}',
        '.tarima-hdr{background:#5F5F5E;color:#fff;padding:7px 12px;font-weight:bold;font-size:11px;display:flex;justify-content:space-between;}',
        '.cama-row{padding:5px 12px;border-bottom:1px solid #ECECEC;display:flex;align-items:center;gap:10px;}',
        '.cama-row:last-child{border-bottom:none;}',
        '.cama-row:nth-child(even){background:#ECECEC;}',
        '.lbl{font-weight:bold;font-size:10px;min-width:38px;color:#5F5F5E;}',
        '.badge{display:inline-block;background:#ECECEC;border-radius:3px;padding:1px 6px;font-size:9px;font-weight:bold;}',
        '.badge-mix{background:#FFF4E8;color:#B36A1A;}',
        '.pend-nota{font-size:10px;color:#B36A1A;}',
        '.contacto{display:flex;gap:24px;background:#F4F4F3;border:1px solid #DCDCDB;border-radius:6px;padding:10px 14px;margin-bottom:16px;}',
        '.contacto div{font-size:11px;}',
        '.contacto .lbl2{font-size:9px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;color:#9A9A99;display:block;margin-bottom:2px;}',
        '@media print{body{padding:0;}@page{margin:14mm;}}'
      ].join('');

      var h = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">';
      h += '<title>Evena Foods – Plan de Tarimas ' + fecha + '</title>';
      h += '<style>' + css + '</style></head><body>';

      // Encabezado
      h += '<div class="hdr">';
      h += '<div style="display:flex;align-items:center;gap:14px;"><img src="' + LOGO_DATA_URI + '" style="height:40px;width:auto;" alt="Evena Foods" /><div><h1>Evena Foods</h1><div style="color:#5F5F5E;margin-top:3px;">Plan de armado de tarimas &nbsp;·&nbsp; PLO-01</div></div></div>';
      h += '<div class="stats">';
      h += '<div>' + fecha + '</div>';
      h += '<div><strong>' + state.pedido.length + '</strong> productos &nbsp;&nbsp; <strong>' + totalCajas + '</strong> cajas &nbsp;&nbsp; <strong>' + tarimas.length + '</strong> tarimas</div>';
      h += '</div></div>';

      // Datos de contacto
      h += '<div class="contacto">';
      h += '<div><span class="lbl2">Nombre de contacto</span>' + esc(state.contactoNombre) + '</div>';
      h += '<div><span class="lbl2">Razón social</span>' + esc(state.contactoRazonSocial) + '</div>';
      h += '</div>';

      // Sección 1: Lista de productos
      h += '<h2>Lista de productos</h2>';
      h += '<table><thead><tr><th>#</th><th>Producto</th><th>Categoría</th><th>Tipo de caja</th><th style="text-align:center;">Cajas</th></tr></thead><tbody>';
      state.pedido.forEach(function (item, i) {
        h += '<tr>';
        h += '<td style="color:#9A9A99;">' + (i + 1) + '</td>';
        h += '<td>' + item.nombre + '</td>';
        h += '<td>' + (item.categoria || '—') + '</td>';
        h += '<td>' + getTipo(item.nombre) + '</td>';
        h += '<td style="text-align:center;font-weight:bold;">' + item.cantidad + '</td>';
        h += '</tr>';
      });
      h += '</tbody></table>';

      // Sección 2: Resumen por tipo
      h += '<h2>Resumen por tipo de caja</h2>';
      h += '<table><thead><tr><th>Tipo de caja</th><th style="text-align:center;">Cajas / Cama</th><th style="text-align:center;">Cajas / Tarima</th><th style="text-align:center;">Cajas pedidas</th><th style="text-align:center;">Tarimas puras</th><th style="text-align:center;">Sobrantes</th></tr></thead><tbody>';
      resumen.forEach(function (row) {
        h += '<tr>';
        h += '<td>' + row.tipo + '</td>';
        h += '<td style="text-align:center;">' + row.cajasCama + '</td>';
        h += '<td style="text-align:center;">' + row.cajasTarima + '</td>';
        h += '<td style="text-align:center;font-weight:bold;">' + row.cajasPedidas + '</td>';
        h += '<td style="text-align:center;">' + row.tarimasPuras + '</td>';
        h += '<td style="text-align:center;color:' + (row.cajasSobrantes > 0 ? '#B36A1A' : '#9A9A99') + ';">' + row.cajasSobrantes + '</td>';
        h += '</tr>';
      });
      h += '</tbody></table>';

      // Sección 3: Distribución de tarimas
      h += '<h2 style="margin-top:24px;">Distribución de tarimas</h2>';

      tarimas.forEach(function (tarima) {
        var totalCajasTarima = tarima.camas.reduce(function (s, c) {
          return s + (c.tipo === 'pura' ? c.cajas : c.items.reduce(function (a, it) { return a + it.cajas; }, 0));
        }, 0);
        var kg  = calcularKgTarima(tarima);
        var cm  = calcularCmTarima(tarima);
        var camasDisplay = tarima.camas.slice().reverse();
        var numCamas = tarima.camas.length;

        h += '<div class="tarima">';
        h += '<div class="tarima-hdr">';
        h += '<span>Tarima #' + tarima.numero + '</span>';
        h += '<span>' + numCamas + ' camas &nbsp;&nbsp; ' + totalCajasTarima + ' cajas &nbsp;&nbsp; ' + kg.toLocaleString('es-MX') + ' kg &nbsp;&nbsp; ' + cm.toFixed(1) + ' cm</span>';
        h += '</div>';

        camasDisplay.forEach(function (cama, di) {
          var numCamaReal = numCamas - di;
          var esTapa = di === 0;
          var esBase = numCamaReal === 1;
          var labelTxt = esTapa ? 'TAPA' : (esBase ? 'BASE' : 'C.' + numCamaReal);

          h += '<div class="cama-row">';
          h += '<span class="lbl">' + labelTxt + '</span>';
          if (cama.tipo === 'pura') {
            h += '<span style="flex:1;">' + cama.tipoCaja + '</span>';
            h += '<span class="badge">' + cama.cajas + ' cajas</span>';
          } else {
            var mixDesc = cama.items.map(function (it) { return it.cajas + ' × ' + it.tipoCaja; }).join(' &nbsp;+&nbsp; ');
            h += '<span style="flex:1;">' + mixDesc + '</span>';
            h += '<span class="badge badge-mix">MIXTA</span>';
          }
          h += '</div>';
        });

        h += '</div>';
      });

      // Pendientes
      if (pendientes.length > 0) {
        h += '<h2>Cajas pendientes</h2>';
        h += '<table><thead><tr><th>Tipo</th><th style="text-align:center;">Cajas</th><th>Nota</th></tr></thead><tbody>';
        pendientes.forEach(function (p) {
          var faltan = SPECS[p.tipo].cajasCama - p.cajas;
          h += '<tr>';
          h += '<td>' + p.tipo + '</td>';
          h += '<td style="text-align:center;">' + p.cajas + '</td>';
          h += '<td class="pend-nota">Faltan ' + faltan + ' cajas para completar una cama</td>';
          h += '</tr>';
        });
        h += '</tbody></table>';
      }

      h += '<div style="margin-top:30px;border-top:1px solid #DCDCDB;padding-top:8px;font-size:9px;color:#9A9A99;">Generado por Evena Foods · PLO-01 · ' + fecha + '</div>';
      h += '</body></html>';

      var win = window.open('', '_blank');
      if (!win) { alert('El navegador bloqueó la ventana emergente. Permite popups para este sitio.'); return; }
      win.document.write(h);
      win.document.close();
      win.focus();
      setTimeout(function () { win.print(); }, 600);
    }

          var totalCajasTarima = tarima.camas.reduce(function (s, c) {
            return s + (c.tipo === "pura" ? c.cajas : c.items.reduce(function (a, i) { return a + i.cajas; }, 0));
          }, 0);
          var camasDisplay = tarima.camas.slice().reverse();

          var kgTarima  = calcularKgTarima(tarima);
          var cmTarima  = calcularCmTarima(tarima);
          var kgStyle   = kgTarima > 1250 ? 'color:#fca5a5;font-weight:800;' : (kgTarima < 900 ? 'color:#fde68a;font-weight:800;' : 'color:#86efac;font-weight:700;');
          var kgPrefix  = (kgTarima < 900 || kgTarima > 1250) ? '⚠ ' : '';
          var cmStyle   = cmTarima > ALTURA_MAX ? 'color:#fca5a5;font-weight:800;' : 'color:#86efac;font-weight:700;';
          var cmPrefix  = cmTarima > ALTURA_MAX ? '⚠ ' : '';

          // Alerta lateral cuando peso o altura quedan fuera de rango
          var issues = [];
          if (kgTarima > 1250) issues.push({ lbl: 'PESO', sub: '▲ ' + kgTarima.toLocaleString('es-MX') + ' kg', danger: true });
          else if (kgTarima < 900) issues.push({ lbl: 'PESO', sub: '▼ ' + kgTarima.toLocaleString('es-MX') + ' kg', danger: false });
          if (cmTarima > ALTURA_MAX) issues.push({ lbl: 'ALTURA', sub: '▲ ' + cmTarima.toFixed(1) + ' cm', danger: true });

          camasDisplay.forEach(function (cama, di) {

            var esTapa  = camaNumReal === tarima.camas.length;

            var labelTxt = esTapa ? "TAPA" : (esBase ? "BASE" : ("C." + camaNumReal));

            html += '      <div class="cama-label" style="background:' + labelBg + ';">';
            html += '        <span class="txt" style="color:' + labelColor + ';">' + labelTxt + '</span>';
            if (esMixta) html += '        <span style="font-size:14px;">🔀</span>';
            html += '      </div>';
            html += '      <div class="cama-content">';
            if (esMixta) {

              html += '        </div>';
              html += '        <div class="mixta-items">';
              cama.items.forEach(function (it) {
                var c       = COLORES_TIPO[it.tipoCaja] || {};
                var tipoEsc = esc(it.tipoCaja);
                var hasPend = (state.pendientes || []).some(function (p) { return p.tipo === it.tipoCaja && p.cajas > 0; });
                html += '          <span class="mixta-chip" draggable="true" data-chip-tarima="' + tIdx + '" data-chip-di="' + di + '" data-chip-tipo="' + tipoEsc + '" style="background:' + (c.bg || 'var(--ev-grey-light)') + ';color:' + (c.text || 'var(--ev-grey)') + ';border-color:' + (c.borde || 'var(--ev-grey-border)') + ';">';
                html += '            <button class="chip-btn chip-minus" data-tarima-idx="' + tIdx + '" data-cama-di="' + di + '" data-tipo="' + tipoEsc + '" title="Quitar 1 caja">−</button>';
                html += '            ' + it.cajas + ' × ' + tipoEsc;
                if (hasPend) html += '            <button class="chip-btn chip-plus" data-tarima-idx="' + tIdx + '" data-cama-di="' + di + '" data-tipo="' + tipoEsc + '" title="Agregar 1 caja de pendientes">+</button>';
                html += '            <span class="esp">(' + it.espacio + ' esp.)</span>';
                html += '          </span>';
              });
              html += '        </div>';
            } else {
              html += '        <div class="cama-pura">';
              html += '          <span class="nombre" style="color:' + (col ? col.text : 'var(--ev-grey)') + ';">' + esc(cama.tipoCaja) + '</span>';
              html += '          <span class="cajas" style="background:' + (col ? col.bg : 'var(--ev-grey-light)') + ';color:' + (col ? col.text : 'var(--ev-grey)') + ';border-color:' + (col ? col.borde : 'var(--ev-grey-border)') + ';">' + cama.cajas + ' cajas</span>';
              html += '        </div>';
            }
            html += '      </div>';
            html += '    </div>';
          });

          html += '    </div>'; // fin tarima-body
          if (issues.length > 0) {
            html += '    <div class="tarima-alert ' + (alertaDanger ? 'tarima-alert-danger' : 'tarima-alert-warn') + '">';
            html += '      <span class="tarima-alert-icon">⚠</span>';
            issues.forEach(function (it) {
              html += '      <div class="tarima-alert-item"><span class="lbl">' + it.lbl + '</span><span class="sub">' + it.sub + '</span></div>';
            });
            html += '    </div>';
          }
          html += '  </div>'; // fin tarima-card
        });
        html += '</div>';
        html += '<div id="drop-nueva-tarima" class="drop-nueva-tarima">⊕ Suelta aquí para crear una nueva tarima</div>';
      }

      if (pendientes.length > 0) {
        html += '<div class="pendientes-card">';
        html += '  <div class="pendientes-title">⚠️ Cajas que no completan ninguna cama (' + pendientes.reduce(function (s, p) { return s + p.cajas; }, 0) + ' cajas)</div>';
        pendientes.forEach(function (p) {
          var faltan = SPECS[p.tipo].cajasCama - p.cajas;
          html += '  <div class="pendiente-row">';
          html += '    <span class="nombre">' + p.cajas + ' × ' + esc(p.tipo) + '</span>';
          html += '    <span class="sugerencia">Pide ' + faltan + ' cajas más para completar una cama, o quita estas ' + p.cajas + ' del pedido</span>';
          html += '  </div>';
        });
        html += '</div>';
      }

      html += '<div style="margin-top:24px;">';
      html += '  <h2 class="section-title">Detalle del pedido (' + state.pedido.length + ' productos)</h2>';
      html += '  <div class="table-card">';
      state.pedido.forEach(function (item) {
        html += '    <div class="detalle-row">';
        html += '      <div><div class="nombre">' + esc(item.nombre) + '</div><div class="cat">' + esc(item.categoria) + '</div></div>';
        html += '      <div class="cant">' + item.cantidad + ' cajas</div>';
        html += '      <div class="tipo">' + esc(getTipo(item.nombre)) + '</div>';
        html += '    </div>';
      });
      html += '  </div>';
      html += '</div>';

      if (state.mostrarModalPDF) html += renderModalPDF();

      return html;
    }

    /* ───── EVENTOS ───── */
    function attachListeners() {
      if (state.vistaTabla) {
        var btnVolver = document.getElementById("btn-volver");
        if (btnVolver) btnVolver.addEventListener("click", function () {
          state.vistaTabla = false;
          state.tarimas = null;
          state.pendientes = null;
          render();
        });
        var btnRecalc = document.getElementById("btn-recalcular");
        if (btnRecalc) btnRecalc.addEventListener("click", function () {
          state.tarimas = null;
          state.pendientes = null;
          render();
        });
        var btnPdf = document.getElementById("btn-pdf");
        if (btnPdf) btnPdf.addEventListener("click", function () {
          state.mostrarModalPDF = true;
          render();
        });

        if (state.mostrarModalPDF) {
          var overlay = document.getElementById("modal-pdf-overlay");
          if (overlay) overlay.addEventListener("mousedown", function (e) {
            if (e.target === overlay) { state.mostrarModalPDF = false; render(); }
          });

          var inputNombre = document.getElementById("input-contacto-nombre");
          if (inputNombre) inputNombre.addEventListener("input", function (e) {
            state.contactoNombre = e.target.value;
            render();
          });

          var inputRazon = document.getElementById("input-contacto-razon");
          if (inputRazon) inputRazon.addEventListener("input", function (e) {
            state.contactoRazonSocial = e.target.value;
            render();
          });

          var onEnterGenerar = function (e) {
            if (e.key === "Enter" && state.contactoNombre.trim() && state.contactoRazonSocial.trim()) {
              state.mostrarModalPDF = false;
              render();
              generarPDF();
            }
          };
          if (inputNombre) inputNombre.addEventListener("keydown", onEnterGenerar);
          if (inputRazon) inputRazon.addEventListener("keydown", onEnterGenerar);

          var btnModalCancelar = document.getElementById("btn-modal-cancelar");
          if (btnModalCancelar) btnModalCancelar.addEventListener("click", function () {
            state.mostrarModalPDF = false;
            render();
          });

          var btnModalGenerar = document.getElementById("btn-modal-generar");
          if (btnModalGenerar) btnModalGenerar.addEventListener("click", function () {
            if (!state.contactoNombre.trim() || !state.contactoRazonSocial.trim()) return;
            state.mostrarModalPDF = false;
            render();
            generarPDF();
          });
        }

        // Drag & drop entre camas
        var camaRows = document.querySelectorAll("[data-cama-di]");
        camaRows.forEach(function (el) {
          el.addEventListener("dragstart", function (e) {
            dragSrc = { tIdx: Number(el.getAttribute("data-tarima-idx")), di: Number(el.getAttribute("data-cama-di")) };
            e.dataTransfer.effectAllowed = "move";
            setTimeout(function () { el.classList.add("dragging"); }, 0);
          });
          el.addEventListener("dragend", function () {
            document.querySelectorAll(".cama-row").forEach(function (r) { r.classList.remove("dragging", "drop-target"); });
          });
          el.addEventListener("dragover", function (e) {
            e.preventDefault();
            document.querySelectorAll(".drop-target").forEach(function (r) { r.classList.remove("drop-target"); });
            el.classList.add("drop-target");
          });
          el.addEventListener("dragleave", function (e) {
            if (!el.contains(e.relatedTarget)) el.classList.remove("drop-target");
          });
          el.addEventListener("drop", function (e) {
            e.preventDefault();
            document.querySelectorAll(".drop-target, .chip-drop-ok").forEach(function (r) { r.classList.remove("drop-target", "chip-drop-ok"); });
            var dstTIdx = Number(el.getAttribute("data-tarima-idx"));
            var dstDi   = Number(el.getAttribute("data-cama-di"));
            if (dragTipo) {
              moverTipoEntreCamas(dragTipo.tIdx, dragTipo.di, dstTIdx, dstDi, dragTipo.tipo);
              dragTipo = null;
            } else if (dragSrc) {
              moveCama(dragSrc.tIdx, dragSrc.di, dstTIdx, dstDi);
              dragSrc = null;
            }
          });
        });

        // Arrastre de tipo entre camas mixtas
        document.querySelectorAll("[data-chip-tipo]").forEach(function (chip) {
          chip.addEventListener("dragstart", function (e) {
            e.stopPropagation(); // No activar el dragstart de la cama-row
            dragTipo = {
              tIdx: Number(chip.getAttribute("data-chip-tarima")),
              di:   Number(chip.getAttribute("data-chip-di")),
              tipo: chip.getAttribute("data-chip-tipo")
            };
            dragSrc = null;
            e.dataTransfer.effectAllowed = "move";
            setTimeout(function () { chip.classList.add("chip-dragging"); }, 0);
          });
          chip.addEventListener("dragend", function () {
            chip.classList.remove("chip-dragging");
            document.querySelectorAll(".chip-drop-ok").forEach(function (r) { r.classList.remove("chip-drop-ok"); });
            dragTipo = null;
          });
        });

        // Resaltar solo camas mixtas cuando se arrastra un chip
        document.querySelectorAll("[data-cama-di]").forEach(function (row) {
          row.addEventListener("dragover", function (e) {
            if (!dragTipo) return; // Lo maneja el handler anterior
            var tIdx = Number(row.getAttribute("data-tarima-idx"));
            var di   = Number(row.getAttribute("data-cama-di"));
            var tari = (state.tarimas || [])[tIdx];
            if (!tari) return;
            var si   = tari.camas.length - 1 - di;
            var cama = tari.camas[si];
            if (cama && cama.tipo === "mixta") {
              e.preventDefault();
              document.querySelectorAll(".chip-drop-ok").forEach(function (r) { r.classList.remove("chip-drop-ok"); });
              row.classList.add("chip-drop-ok");
            }
          });
        });

        // Botones +/− de cajas dentro de camas mixtas
        document.querySelectorAll(".chip-minus").forEach(function (el) {
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            quitarCajaMixta(Number(el.getAttribute("data-tarima-idx")), Number(el.getAttribute("data-cama-di")), el.getAttribute("data-tipo"));
          });
        });
        document.querySelectorAll(".chip-plus").forEach(function (el) {
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            agregarCajaMixta(Number(el.getAttribute("data-tarima-idx")), Number(el.getAttribute("data-cama-di")), el.getAttribute("data-tipo"));
          });
        });

        // Zona "nueva tarima"
        var zonaNueva = document.getElementById("drop-nueva-tarima");
        if (zonaNueva) {
          zonaNueva.addEventListener("dragover", function (e) {
            e.preventDefault();
            document.querySelectorAll(".drop-target").forEach(function (r) { r.classList.remove("drop-target"); });
            zonaNueva.classList.add("drop-target");
          });
          zonaNueva.addEventListener("dragleave", function (e) {
            if (!zonaNueva.contains(e.relatedTarget)) zonaNueva.classList.remove("drop-target");
          });
          zonaNueva.addEventListener("drop", function (e) {
            e.preventDefault();
            zonaNueva.classList.remove("drop-target");
            if (!dragSrc) return;
            crearNuevaTarima(dragSrc.tIdx, dragSrc.di);
            dragSrc = null;
          });
        }
        return;
      }

      var inputBusqueda = document.getElementById("input-busqueda");
      if (inputBusqueda) {
        inputBusqueda.addEventListener("input", function (e) {
          state.busqueda = e.target.value;
          state.seleccionado = null;
          state.mostrarDrop = true;
          state.highlightIdx = 0;
          render();
        });
        inputBusqueda.addEventListener("focus", function () {
          if (isRendering) return;
          state.mostrarDrop = true;
          render();
        });
        inputBusqueda.addEventListener("blur", function () {
          if (isRendering) return; // el input viejo se está reemplazando, no es un blur real del usuario
          setTimeout(function () { state.mostrarDrop = false; render(); }, 150);
        });
        inputBusqueda.addEventListener("keydown", function (e) {
          var sugerencias = getSugerencias();
          if (!state.mostrarDrop || sugerencias.length === 0) return;
          if (e.key === "ArrowDown") {
            e.preventDefault();
            state.highlightIdx = Math.min(state.highlightIdx + 1, sugerencias.length - 1);
            render();
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            state.highlightIdx = Math.max(state.highlightIdx - 1, 0);
            render();
          } else if (e.key === "Enter") {
            e.preventDefault();
            elegirProducto(sugerencias[state.highlightIdx]);
          } else if (e.key === "Escape") {
            state.mostrarDrop = false;
            render();
          }
        });
      }

      var dropdownItems = document.querySelectorAll("[data-sugerencia-idx]");
      dropdownItems.forEach(function (el) {
        el.addEventListener("mousedown", function (e) {
          e.preventDefault();
          var idx = Number(el.getAttribute("data-sugerencia-idx"));
          elegirProducto(getSugerencias()[idx]);
        });
      });

      var inputCantidad = document.getElementById("input-cantidad");
      if (inputCantidad) {
        inputCantidad.addEventListener("input", function (e) {
          state.cantidad = e.target.value.replace(/[^0-9]/g, "");
          render();
        });
        inputCantidad.addEventListener("keydown", function (e) {
          if (e.key === "Enter") agregarAlPedido();
        });
      }

      var btnAgregar = document.getElementById("btn-agregar");
      if (btnAgregar) btnAgregar.addEventListener("click", agregarAlPedido);

      var removeBtns = document.querySelectorAll("[data-quitar-idx]");
      removeBtns.forEach(function (el) {
        el.addEventListener("click", function () {
          quitarItem(Number(el.getAttribute("data-quitar-idx")));
        });
      });

      var btnLimpiar = document.getElementById("btn-limpiar");
      if (btnLimpiar) btnLimpiar.addEventListener("click", function () { state.pedido = []; render(); });

      var btnArmar = document.getElementById("btn-armar");
      if (btnArmar) btnArmar.addEventListener("click", function () {
        state.vistaTabla = true;
        state.tarimas = null;
        state.pendientes = null;
        render();
      });
    }

    render();
  })();
  </script>
</body>
</html>
